<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A vs B — outline strokes vs filled silhouette</title>
<style>
  :root { --void-0:#0a0a08; --void-1:#12110e; --arcane:#d4a74a; --cream:#f0e6d3; --dim:#979182; --bronze:#8b7355; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--void-0); color:var(--cream); font-family:system-ui,sans-serif; padding:22px; }
  h2 { font-size:14px; color:var(--arcane); margin:20px 0 4px; font-weight:600; }
  .sub { font-size:11px; color:var(--dim); margin-bottom:12px; }
  .strip { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .mark { border-radius:9px; flex-shrink:0; overflow:hidden;
          border:1px solid rgba(212,167,74,.22);
          background:linear-gradient(160deg,#1c1a15,#100f0c); }
  .mark img { display:block; width:100%; height:100%; }
  .s34 { width:34px; height:34px; }
  .s72 { width:72px; height:72px; border-radius:16px; }
  .cap { font-size:10px; color:var(--bronze); text-align:center; margin-top:5px; }
  .cell { text-align:center; }
</style>
</head>
<body>

<h2>A — outline strokes (first pilot), at 34px</h2>
<div class="strip">
  <div class="cell"><div class="mark s34"><img src="./1-hearthbrand.svg"></div><div class="cap">glaive</div></div>
  <div class="cell"><div class="mark s34"><img src="./2-sacred-flame.svg"></div><div class="cap">flame</div></div>
  <div class="cell"><div class="mark s34"><img src="./3-cure-wounds.svg"></div><div class="cap">heart</div></div>
  <div class="cell"><div class="mark s34"><img src="./4-interception.svg"></div><div class="cap">shield</div></div>
</div>

<h2>B — filled silhouette (second pilot), at 34px</h2>
<div class="sub">Same four shapes, same colours, same frame. Only the prompt changed.</div>
<div class="strip">
  <div class="cell"><div class="mark s34"><img src="./b1-hearthbrand.svg"></div><div class="cap">glaive</div></div>
  <div class="cell"><div class="mark s34"><img src="./b2-sacred-flame.svg"></div><div class="cap">flame</div></div>
  <div class="cell"><div class="mark s34"><img src="./b3-cure-wounds.svg"></div><div class="cap">heart</div></div>
  <div class="cell"><div class="mark s34"><img src="./b4-interception.svg"></div><div class="cap">shield</div></div>
</div>

<h2>B at 72px — card size</h2>
<div class="strip">
  <div class="cell"><div class="mark s72"><img src="./b1-hearthbrand.svg"></div></div>
  <div class="cell"><div class="mark s72"><img src="./b2-sacred-flame.svg"></div></div>
  <div class="cell"><div class="mark s72"><img src="./b3-cure-wounds.svg"></div></div>
  <div class="cell"><div class="mark s72"><img src="./b4-interception.svg"></div></div>
</div>

</body>
</html>
