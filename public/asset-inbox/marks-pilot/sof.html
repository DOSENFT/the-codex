<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>shield-of-faith candidates</title>
<style>
 body{background:#0a0a08;color:#f0e6d3;font-family:system-ui;padding:20px}
 h2{font-size:12px;color:#d4a74a;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em}
 .strip{display:flex;gap:14px;align-items:center}
 .mark{border-radius:9px;overflow:hidden;border:1px solid rgba(212,167,74,.22);
       background:linear-gradient(160deg,#1c1a15,#100f0c);flex-shrink:0}
 .mark img{display:block;width:100%;height:100%}
 .s34{width:34px;height:34px}.s72{width:72px;height:72px;border-radius:16px}
 .cap{font-size:10px;color:#8b7355;text-align:center;margin-top:4px}
 .cell{text-align:center}
</style></head><body>
<h2>34px — candidates A and B beside the marks they must not collide with</h2>
<div class="strip">
 <div class="cell"><div class="mark s34"><img src="./sof-a.svg"></div><div class="cap">A</div></div>
 <div class="cell"><div class="mark s34"><img src="./sof-b.svg"></div><div class="cap">B</div></div>
 <div class="cell"><div class="mark s34"><img src="/the-codex/marks/sentinel.svg"></div><div class="cap">sentinel</div></div>
 <div class="cell"><div class="mark s34"><img src="/the-codex/marks/interception.svg"></div><div class="cap">intercept</div></div>
 <div class="cell"><div class="mark s34"><img src="/the-codex/marks/hearthfire-manifest.svg"></div><div class="cap">hearthfire</div></div>
 <div class="cell"><div class="mark s34"><img src="/the-codex/marks/shield-of-faith.svg"></div><div class="cap">current</div></div>
</div>
<h2>72px</h2>
<div class="strip">
 <div class="cell"><div class="mark s72"><img src="./sof-a.svg"></div><div class="cap">A</div></div>
 <div class="cell"><div class="mark s72"><img src="./sof-b.svg"></div><div class="cap">B</div></div>
</div>
</body></html>
