<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="The Codex — D&D 2024 Mastery Companion" />
    <!-- SLICE 10 — three <link>s used to live here, fetching Cinzel, IBM Plex
         Sans and JetBrains Mono from the Google Fonts API, render-blocking, at
         a table that may have no internet. They are gone; the faces are bundled
         and imported by src/main.tsx. Do not put them back: a <link> to a CDN
         is invisible to the service worker's precache, so it would silently
         reopen the exact hole this slice closed. -->
    <link rel="manifest" href="/the-codex/manifest.webmanifest" />
    <!-- iOS does not read the manifest for the home screen. It reads this. -->
    <link rel="apple-touch-icon" href="/the-codex/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/the-codex/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <title>The Codex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
